<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300">
<defs>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".90"/><stop offset=".29" stop-color="#e8efff" stop-opacity=".44"/><stop offset=".68" stop-color="#d8d5ff" stop-opacity=".24"/><stop offset="1" stop-color="#ffe9d9" stop-opacity=".66"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#9fb3ff" stop-opacity=".46"/><stop offset="1" stop-color="#ffdcbb" stop-opacity=".86"/></linearGradient>
  <linearGradient id="pearl" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#eff8ff" stop-opacity=".7"/><stop offset=".48" stop-color="#c8c9fa" stop-opacity=".22"/><stop offset=".8" stop-color="#f9d8e9" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity=".65"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#e0ddff" stop-opacity=".65"/><stop offset=".55" stop-color="#d5eeff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="warm"><stop stop-color="#ffdfcf" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="48"/></filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="24" result="b"/><feOffset dy="18" result="o"/><feComponentTransfer in="o" result="s"><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shine"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<ellipse cx="950" cy="680" rx="610" ry="550" fill="url(#halo)"/>
<ellipse cx="1260" cy="390" rx="350" ry="400" fill="url(#warm)"/>
