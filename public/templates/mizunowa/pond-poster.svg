  <g transform="translate(478 672) rotate(-92)">
    <ellipse cx="-6" cy="8" rx="48" ry="16" fill="#0B1E1C" opacity="0.45"/>
    <path d="M12 -10 C22 -27, 4 -32, -8 -16 Z" fill="#F4EFE2" fill-opacity="0.68"/>
