      <stop offset="65%" stop-color="#C7A6A2"/>
      <stop offset="100%" stop-color="#8C6D6B"/>
    </radialGradient>
    <linearGradient id="mnw-roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3833"/>
      <stop offset="100%" stop-color="#1E2320"/>
    </linearGradient>
    <filter id="mnw-soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

