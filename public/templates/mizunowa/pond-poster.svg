    <radialGradient id="mnw-sun-wash" cx="38%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#F4EFE2" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#CB9462" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#112C2A" stop-opacity="0"/>
