    <ellipse cx="1272" cy="575" rx="74" ry="38" transform="rotate(34 1272 575)" fill="#8E8570"/>
    <ellipse cx="1268" cy="569" rx="67" ry="33" transform="rotate(34 1268 569)" fill="#D6C7A9"/>
