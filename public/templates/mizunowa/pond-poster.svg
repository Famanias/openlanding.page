    <ellipse cx="-4" cy="8" rx="45" ry="15" fill="#0B1E1C" opacity="0.45"/>
    <path d="M10 -9 C20 -25, 2 -29, -8 -15 Z" fill="#FDFBF5" fill-opacity="0.7"/>
    <path d="M10 9 C20 25, 2 29, -8 15 Z" fill="#FDFBF5" fill-opacity="0.7"/>
    <path d="M-36 0 C-49 -13, -61 -15, -63 -7 C-55 -2, -55 2, -63 7 C-61 15, -49 13, -36 0 Z" fill="#FDFBF5" fill-opacity="0.82"/>
    <path d="M41 0 C39 -11, 20 -15, 0 -13 C-19 -11, -32 -6, -39 0 C-32 6, -19 11, 0 13 C20 15, 39 11, 41 0 Z" fill="#FDFBF5"/>
    <!-- Charcoal patches -->
    <path d="M25 -9 C14 -12, 4 -6, 6 2 C10 9, 24 8, 29 1 C32 -3, 30 -7, 25 -9 Z" fill="#1E2320"/>
    <path d="M-6 -10 C-18 -10, -26 -4, -24 3 C-21 8, -9 9, -4 3 C0 -2, -1 -9, -6 -10 Z" fill="#1E2320"/>
    <path d="M8 0 C-3 -2, -16 -2, -26 0 C-16 2, -3 2, 8 0 Z" fill="#D6C7A9" opacity="0.65"/>
    <circle cx="33" cy="-6.5" r="2.1" fill="#1E2320"/>
    <circle cx="33" cy="6.5" r="2.1" fill="#1E2320"/>
