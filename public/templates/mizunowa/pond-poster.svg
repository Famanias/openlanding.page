    <ellipse cx="1128" cy="342" rx="25" ry="12" transform="rotate(-22 1128 342)" fill="#C9BA9E"/>
    <ellipse cx="1168" cy="310" rx="27" ry="13" transform="rotate(-22 1168 310)" fill="#D6C7A9"/>
    <ellipse cx="1208" cy="278" rx="26" ry="12" transform="rotate(-20 1208 278)" fill="#C9BA9E"/>
    <ellipse cx="1248" cy="248" rx="28" ry="13" transform="rotate(-18 1248 248)" fill="#D6C7A9"/>
  </g>

  <!-- Timber worship hall at greater Z depth (upper-right background, aligned with path) -->
  <g transform="translate(1285 170)">
    <!-- Ground contact shadow -->
    <ellipse cx="8" cy="68" rx="116" ry="38" fill="#0B1E1C" opacity="0.52" filter="url(#mnw-soft-shadow)"/>
    <!-- Raised stone plinth & timber veranda -->
    <polygon points="-92,52 92,38 112,64 -72,78" fill="#8C8370"/>
    <polygon points="-82,42 84,30 100,50 -66,64" fill="#A67E53"/>
    <!-- Dark timber uprights & plastered wall panels -->
    <polygon points="-70,40 72,29 72,-10 -70,1" fill="#3B312B"/>
    <polygon points="-58,34 60,25 60,-6 -58,3" fill="#EAE2D0"/>
    <!-- Vertical timber posts -->
    <rect x="-70" y="-10" width="9" height="50" fill="#2A221D"/>
    <rect x="-26" y="-12" width="8" height="48" fill="#2A221D"/>
    <rect x="20" y="-15" width="8" height="47" fill="#2A221D"/>
    <rect x="64" y="-18" width="9" height="48" fill="#2A221D"/>
    <!-- Sanctuary doorway recess -->
    <rect x="-14" y="-2" width="28" height="36" fill="#201A17"/>
    <!-- Gabled roof with generous eaves -->
    <polygon points="-108,2 88,-14 110,16 -86,32" fill="#262A27"/>
    <polygon points="-102,-2 0,-64 102,-14 0,6" fill="url(#mnw-roof)"/>
    <!-- Ridge beam -->
