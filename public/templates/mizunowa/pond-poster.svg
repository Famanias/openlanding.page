    <ellipse cx="810" cy="952" rx="86" ry="38" transform="rotate(2 810 952)" fill="#8C836F"/>
    <ellipse cx="808" cy="946" rx="79" ry="33" transform="rotate(2 808 946)" fill="#D6C7A9"/>
    <ellipse cx="598" cy="928" rx="78" ry="36" transform="rotate(10 598 928)" fill="#8C836F"/>
    <ellipse cx="595" cy="922" rx="71" ry="31" transform="rotate(10 595 922)" fill="#C8B99D"/>
    <ellipse cx="425" cy="852" rx="74" ry="36" transform="rotate(22 425 852)" fill="#8A816D"/>
    <ellipse cx="422" cy="846" rx="67" ry="31" transform="rotate(22 422 846)" fill="#D6C7A9"/>
    <ellipse cx="322" cy="735" rx="68" ry="38" transform="rotate(64 322 735)" fill="#8B826E"/>
    <ellipse cx="318" cy="730" rx="61" ry="33" transform="rotate(64 318 730)" fill="#C9BA9E"/>
