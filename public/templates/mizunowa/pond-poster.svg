    <line x1="-22" y1="-50" x2="26" y2="-54" stroke="#CB9462" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Land-based Vermilion Torii standing on the approach -->
  <g transform="translate(1152 308)">
    <!-- Shadow on approach -->
    <ellipse cx="14" cy="34" rx="54" ry="18" fill="#0B1E1C" opacity="0.46"/>
    <!-- Stone column bases -->
    <ellipse cx="-32" cy="24" rx="10" ry="6" fill="#1E2320"/>
    <ellipse cx="32" cy="18" rx="10" ry="6" fill="#1E2320"/>
    <!-- Left and right vermilion pillars -->
    <rect x="-37" y="-56" width="11" height="80" rx="2" fill="#9E3F32"/>
    <rect x="26" y="-62" width="11" height="80" rx="2" fill="#9E3F32"/>
    <!-- Lower tie beam (nuki) -->
    <polygon points="-46,-36 46,-44 46,-35 -46,-27" fill="#8C352A"/>
    <!-- Upper lintel (kasagi) with gentle upward curve -->
    <path d="M-58 -64 Q0 -62 58 -72 L54 -60 Q0 -52 -54 -54 Z" fill="#9E3F32"/>
    <!-- Dark cap beam (kasagi top) -->
    <path d="M-60 -66 Q0 -64 60 -74 L58 -68 Q0 -59 -58 -61 Z" fill="#1E2320"/>
    <!-- Center strut (gakuzuka) -->
    <rect x="-4" y="-56" width="8" height="16" fill="#8C352A"/>
  </g>

  <!-- UPPER-LEFT SAKURA TREE (full tree with tapering trunk, asymmetric branches, blossom clusters with negative space) -->
  <g transform="translate(278 446)">
    <!-- Soft ground shadow -->
    <ellipse cx="38" cy="24" rx="115" ry="44" fill="#0B1E1C" opacity="0.42"/>
    <!-- Trunk and primary asymmetric branches -->
    <path d="M-12 22 C-8 -18, 2 -60, 10 -105 C16 -142, 42 -175, 84 -206" stroke="#2D231E" stroke-width="26" stroke-linecap="round"/>
    <path d="M6 -68 C-28 -108, -68 -136, -112 -156" stroke="#2D231E" stroke-width="15" stroke-linecap="round"/>
    <path d="M16 -122 C-18 -164, -44 -204, -56 -246" stroke="#362A24" stroke-width="12" stroke-linecap="round"/>
    <path d="M36 -156 C84 -174, 134 -172, 178 -154" stroke="#362A24" stroke-width="11" stroke-linecap="round"/>
    <path d="M66 -190 C96 -222, 136 -246, 174 -256" stroke="#3E3029" stroke-width="8" stroke-linecap="round"/>
    <path d="M-46 -126 C-88 -132, -124 -118, -148 -98" stroke="#3E3029" stroke-width="8" stroke-linecap="round"/>

    <!-- Blossom clusters with negative space showing dark branches -->
    <g>
      <circle cx="-116" cy="-164" r="56" fill="url(#mnw-blossom-a)" opacity="0.92"/>
      <circle cx="-154" cy="-120" r="44" fill="url(#mnw-blossom-b)" opacity="0.88"/>
      <circle cx="-68" cy="-214" r="52" fill="url(#mnw-blossom-b)" opacity="0.93"/>
      <circle cx="-20" cy="-264" r="62" fill="url(#mnw-blossom-a)" opacity="0.94"/>
      <circle cx="56" cy="-248" r="58" fill="url(#mnw-blossom-b)" opacity="0.92"/>
      <circle cx="128" cy="-254" r="48" fill="url(#mnw-blossom-a)" opacity="0.9"/>
      <circle cx="182" cy="-220" r="46" fill="url(#mnw-blossom-b)" opacity="0.88"/>
      <circle cx="152" cy="-152" r="54" fill="url(#mnw-blossom-a)" opacity="0.93"/>
      <circle cx="206" cy="-166" r="36" fill="url(#mnw-blossom-b)" opacity="0.86"/>
      <circle cx="48" cy="-178" r="42" fill="url(#mnw-blossom-b)" opacity="0.85"/>
      <circle cx="-86" cy="-120" r="38" fill="url(#mnw-blossom-a)" opacity="0.86"/>
      <!-- Soft sunlit petal highlights -->
      <circle cx="-28" cy="-278" r="28" fill="#F4EFE2" opacity="0.28"/>
      <circle cx="66" cy="-262" r="24" fill="#F4EFE2" opacity="0.25"/>
      <circle cx="158" cy="-168" r="22" fill="#F4EFE2" opacity="0.24"/>
      <circle cx="-120" cy="-180" r="22" fill="#F4EFE2" opacity="0.24"/>
    </g>
  </g>

  <!-- Quiet foreground reed / moss tufts at lower-right and lower-left banks -->
  <g fill="#526E58" opacity="0.78">
    <ellipse cx="1372" cy="836" rx="22" ry="12"/>
    <ellipse cx="1394" cy="848" rx="18" ry="10" fill="#203D33"/>
    <ellipse cx="288" cy="868" rx="24" ry="13"/>
    <ellipse cx="268" cy="880" rx="19" ry="10" fill="#203D33"/>
