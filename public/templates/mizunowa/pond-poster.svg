    <path d="M26 -6 C12 -10, -10 -8, -24 -2 C-12 2, 10 2, 26 -6 Z" fill="#E3B989" opacity="0.65"/>
    <path d="M10 0 C-2 -3, -18 -2, -28 0 C-18 2, -2 3, 10 0 Z" fill="#FDFBF5" opacity="0.55"/>
    <circle cx="36" cy="-7" r="2.2" fill="#1E2320"/>
    <circle cx="36" cy="7" r="2.2" fill="#1E2320"/>
  </g>

