  <!-- 4 KOI (drawn underwater with soft depth tint) -->
  <!-- Koi 1: Red and white (outer route right, heading +Z / downward) -->
  <g transform="translate(1122 664) rotate(88)">
    <ellipse cx="-6" cy="8" rx="48" ry="16" fill="#0B1E1C" opacity="0.45"/>
    <!-- Pectoral fins -->
    <path d="M12 -10 C22 -27, 4 -32, -8 -16 Z" fill="#FDFBF5" fill-opacity="0.72"/>
    <path d="M12 10 C22 27, 4 32, -8 16 Z" fill="#FDFBF5" fill-opacity="0.72"/>
    <!-- Caudal forked tail -->
    <path d="M-38 0 C-52 -14, -64 -16, -66 -8 C-58 -2, -58 2, -66 8 C-64 16, -52 14, -38 0 Z" fill="#FDFBF5" fill-opacity="0.82"/>
    <!-- Body -->
    <path d="M44 0 C42 -12, 22 -16, 0 -14 C-20 -12, -34 -6, -42 0 C-34 6, -20 12, 0 14 C22 16, 42 12, 44 0 Z" fill="#FDFBF5"/>
