    <path d="M-36 0 C-49 -13, -61 -15, -63 -7 C-55 -2, -55 2, -63 7 C-61 15, -49 13, -36 0 Z" fill="#FDFBF5" fill-opacity="0.82"/>
    <path d="M41 0 C39 -11, 20 -15, 0 -13 C-19 -11, -32 -6, -39 0 C-32 6, -19 11, 0 13 C20 15, 39 11, 41 0 Z" fill="#FDFBF5"/>
    <path d="M31 -5 C25 -12, 11 -11, 8 -3 C6 4, 16 10, 26 7 C32 5, 34 0, 31 -5 Z" fill="#9E3F32"/>
    <path d="M4 -10 C-6 -12, -16 -6, -15 2 C-13 8, -2 10, 5 5 C9 1, 9 -8, 4 -10 Z" fill="#1E2320"/>
    <path d="M-19 -6 C-26 -7, -33 -3, -31 2 C-29 6, -21 6, -17 2 C-15 -1, -16 -5, -19 -6 Z" fill="#9E3F32"/>
    <path d="M8 0 C-3 -2, -16 -2, -26 0 C-16 2, -3 2, 8 0 Z" fill="#F4EFE2" opacity="0.65"/>
    <circle cx="33" cy="-6.5" r="2.1" fill="#1E2320"/>
    <circle cx="33" cy="6.5" r="2.1" fill="#1E2320"/>
  </g>

