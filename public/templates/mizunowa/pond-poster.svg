    <ellipse cx="620" cy="645" rx="44" ry="24" transform="rotate(-14 620 645)" fill="#2D4A42"/>
    <ellipse cx="617" cy="642" rx="34" ry="18" transform="rotate(-14 617 642)" fill="#5A6659"/>
    <ellipse cx="968" cy="712" rx="52" ry="28" transform="rotate(18 968 712)" fill="#2A463F"/>
    <ellipse cx="965" cy="708" rx="40" ry="21" transform="rotate(18 965 708)" fill="#525F53"/>
    <ellipse cx="775" cy="568" rx="36" ry="20" transform="rotate(8 775 568)" fill="#2B463E"/>
    <ellipse cx="773" cy="565" rx="27" ry="14" transform="rotate(8 773 565)" fill="#586457"/>
