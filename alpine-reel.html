<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpine Reel — Fourteen peaks. One moving frame.</title>
  <meta name="description" content="A cinematic horizontal reel through the fourteen eight-thousanders.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23040B16'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23FFFFFF' stroke-width='2'/%3E%3Cpath d='M11 43 24 26 32 36 42 21 54 43' fill='none' stroke='%23FFFFFF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M22 51h20' stroke='%236EA8D2' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='49' cy='17' r='4' fill='%236EA8D2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --arl-abyss: #040B16;
      --arl-navy: #08162A;
      --arl-ice: #6EA8D2;
      --arl-snow: #FFFFFF;
      --arl-ink-soft: color-mix(in srgb, var(--arl-snow) 78%, transparent);
      --arl-ink-muted: color-mix(in srgb, var(--arl-snow) 56%, transparent);
      --arl-ink-faint: color-mix(in srgb, var(--arl-snow) 24%, transparent);
      --arl-line: color-mix(in srgb, var(--arl-snow) 15%, transparent);
      --arl-pad-y: 7.5dvh;
      --arl-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --arl-ease-door: cubic-bezier(0.22, 1, 0.36, 1);
      --arl-ease-settle: cubic-bezier(0.65, 0, 0.35, 1);
      --arl-dur-fast: 180ms;
      --arl-dur-base: 420ms;
      --arl-dur-door: 700ms;
      --arl-dur-reveal: 900ms;
      --arl-scan-opacity: 0;
      --arl-initial-transform: translate3d(calc(10vw - 29 * 85vw), 0, 0);
      --font-geist-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-geist-mono: "Geist Mono", ui-monospace, monospace;
      --font-playfair: "Playfair Display", Georgia, serif;
      --font-arl-display: var(--font-playfair), Georgia, serif;
      --font-arl-body: var(--font-geist-sans), ui-sans-serif, sans-serif;
      --font-arl-mono: var(--font-geist-mono), ui-monospace, monospace;
      --font-outlier: var(--font-geist-mono), ui-monospace, monospace;
    }

    html,
    body {
      overflow-x: clip;
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--arl-abyss);
      color: var(--arl-snow);
      font-family: var(--font-arl-body);
      -webkit-font-smoothing: antialiased;
      font-synthesis: none;
    }

    body[data-arl-modal="open"] {
      overflow: clip;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
      color: inherit;
      font-family: inherit;
    }

    button {
      background: none;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--arl-ice);
      outline-offset: 4px;
    }

    .arl-reel {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      isolation: isolate;
      overflow: clip;
      background: var(--arl-abyss);
      color: var(--arl-snow);
      cursor: none;
      user-select: none;
      touch-action: none;
    }

    .arl-visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: clip;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .arl-defs {
      position: absolute;
      pointer-events: none;
    }

    .arl-header {
      position: absolute;
      inset: 0 0 auto;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 3.2dvh 5dvh;
      color: var(--arl-ink-soft);
      pointer-events: none;
    }

    .arl-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--arl-snow);
      font-family: var(--font-arl-display);
      font-size: clamp(17px, 1.8vw, 24px);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .arl-logo__text span {
      font-style: italic;
    }

    .arl-mark {
      width: 36px;
      height: 36px;
      color: currentColor;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arl-mark circle:last-child {
      fill: var(--arl-ice);
      stroke: var(--arl-ice);
    }

    .arl-mark--compact {
      width: 28px;
      height: 28px;
    }

    .arl-header__right {
      display: flex;
      align-items: center;
      gap: 24px;
      font: 500 10px/1 var(--font-arl-mono);
    }

    .arl-header__hint {
      color: var(--arl-ink-muted);
    }

    .arl-stage {
      position: absolute;
      inset: 0;
      overflow: clip;
    }

    .arl-reel[data-intro="true"][data-enhanced="true"] .arl-stage {
      filter: url(#arl-motion-blur);
    }

    .arl-track {
      position: absolute;
      inset: var(--arl-pad-y) auto var(--arl-pad-y) 0;
      display: flex;
      align-items: stretch;
      width: max-content;
      will-change: transform;
      transform: var(--arl-initial-transform);
    }

    .arl-slide {
      position: relative;
      flex: 0 0 80vw;
      width: 80vw;
      height: 100%;
      margin-right: 5vw;
      perspective: 2000px;
      content-visibility: auto;
      contain-intrinsic-size: auto 80vw auto 100dvh;
    }

    .arl-slide__inner {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: clip;
      border: 1px solid var(--arl-line);
      border-radius: clamp(24px, 3.3vw, 48px);
      background: var(--arl-navy);
      transform-origin: 0% 50%;
      transition: transform var(--arl-dur-door) var(--arl-ease-door), box-shadow var(--arl-dur-door) var(--arl-ease-door);
    }

    .arl-slide[data-open="true"] .arl-slide__inner {
      transform: rotateY(15deg);
    }

    .arl-slide__image {
      position: absolute;
      inset: 0;
      width: 120vw;
      height: 100%;
      margin-left: -20vw;
      transform: translate3d(var(--arl-parallax, 0px), 0, 0) scale(1.03);
    }

    .arl-slide[data-active="true"] .arl-slide__image {
      will-change: transform;
    }

    .arl-slide__image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: grayscale(100%) contrast(1.12) brightness(0.84);
      user-select: none;
      pointer-events: none;
    }

    .arl-slide__tint,
    .arl-slide__vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .arl-slide__tint {
      background: color-mix(in srgb, var(--arl-navy) 62%, transparent);
      mix-blend-mode: color;
    }

    .arl-slide__vignette {
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--arl-abyss) 70%, transparent) 0%, transparent 30%, color-mix(in srgb, var(--arl-abyss) 58%, transparent) 100%),
        radial-gradient(ellipse at 50% 48%, transparent 10%, color-mix(in srgb, var(--arl-abyss) 44%, transparent) 100%);
    }

    .arl-slide__content {
      position: absolute;
      inset: 0;
      display: block;
      opacity: 1;
      filter: blur(0);
      transform: translate3d(0, 0, 0);
      transition: opacity var(--arl-dur-reveal) var(--arl-ease-out), transform var(--arl-dur-reveal) var(--arl-ease-out), filter var(--arl-dur-reveal) var(--arl-ease-out);
      pointer-events: none;
    }

    .arl-reel[data-enhanced="true"] .arl-slide[data-active="true"] .arl-slide__content {
      opacity: var(--arl-content-opacity, 1);
      transform: translate3d(var(--arl-content-x, 0px), 0, 0);
      filter: blur(var(--arl-content-blur, 0px));
    }

    .arl-reel[data-intro="true"][data-js] .arl-slide .arl-slide__content {
      opacity: 0;
    }

    .arl-slide__topline {
      position: absolute;
      top: 5.5dvh;
      left: 6dvh;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .arl-year {
      color: var(--arl-snow);
      font: italic 600 clamp(1.35rem, 2.3dvh, 2.5rem)/1 var(--font-arl-display);
    }

    .arl-eyebrow {
      display: grid;
      gap: 3px;
      max-width: 20ch;
      color: var(--arl-ink-soft);
      font: 500 10px/1.3 var(--font-arl-mono);
    }

    .arl-badge {
      display: grid;
      gap: 2px;
      margin-left: 5px;
      padding: 8px 10px 7px;
      border: 1px solid var(--arl-ink-faint);
      border-radius: 999px;
      color: var(--arl-snow);
      font: 500 10px/1 var(--font-arl-mono);
      text-align: center;
    }

    .arl-badge small {
      color: var(--arl-ink-muted);
      font-size: 8px;
    }

    .arl-slide__title-block {
      position: absolute;
      left: 6dvh;
      bottom: 9dvh;
      max-width: min(45vw, 620px);
    }

    .arl-range {
      margin: 0 0 14px;
      color: var(--arl-ink-muted);
      font: 500 10px/1 var(--font-arl-mono);
    }

    .arl-slide h2 {
      display: grid;
      gap: 0;
      margin: 0;
      color: var(--arl-snow);
      font: 600 clamp(3.25rem, 9.2dvh, 9rem)/0.86 var(--font-arl-display);
      letter-spacing: -0.045em;
      text-transform: uppercase;
      text-wrap: balance;
      overflow-wrap: break-word;
      min-width: 0;
    }

    .arl-slide h2 span:last-child {
      color: var(--arl-ice);
    }

    .arl-ascent-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      margin-top: 22px;
      color: var(--arl-ink-soft);
      font: 500 10px/1.45 var(--font-arl-mono);
    }

    .arl-ascent-row span {
      display: grid;
      gap: 4px;
    }

    .arl-ascent-row b {
      color: var(--arl-ink-muted);
      font-weight: 400;
    }

    .arl-slide__awards {
      position: absolute;
      top: 50%;
      right: 6dvh;
      display: grid;
      gap: 15px;
      width: min(26vw, 330px);
      transform: translateY(-50%);
    }

    .arl-award {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 5px 10px;
      align-items: baseline;
      min-width: 0;
    }

    .arl-stars {
      display: inline-flex;
      gap: 2px;
      color: var(--arl-ink-faint);
      font-size: 10px;
    }

    .arl-stars span[data-filled="true"] {
      color: var(--arl-ice);
    }

    .arl-award__label {
      color: var(--arl-ink-soft);
      font: 500 9px/1.2 var(--font-arl-mono);
    }

    .arl-award__quote {
      grid-column: 2;
      color: var(--arl-ink-muted);
      font: italic 400 12px/1.25 var(--font-arl-display);
    }

    .arl-explore {
      position: absolute;
      right: 6dvh;
      bottom: 5dvh;
      display: inline-flex;
      align-items: center;
      gap: 15px;
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid var(--arl-ink-faint);
      border-radius: 999px;
      background: color-mix(in srgb, var(--arl-navy) 50%, transparent);
      color: var(--arl-snow);
      font: 500 10px/1 var(--font-arl-mono);
      pointer-events: auto;
      cursor: pointer;
      transition: transform var(--arl-dur-fast) var(--arl-ease-out), border-color var(--arl-dur-fast) var(--arl-ease-out), background-color var(--arl-dur-fast) var(--arl-ease-out), box-shadow var(--arl-dur-base) var(--arl-ease-out);
    }

    .arl-explore span:last-child {
      color: var(--arl-ice);
      font-size: 18px;
      line-height: 1;
      transition: transform var(--arl-dur-fast) var(--arl-ease-out);
    }

    .arl-explore:hover {
      transform: translateY(-4px);
      border-color: var(--arl-snow);
      background: color-mix(in srgb, var(--arl-snow) 12%, transparent);
      box-shadow: 0 10px 30px color-mix(in srgb, var(--arl-abyss) 65%, transparent);
    }

    .arl-explore:hover span:last-child {
      transform: translate(3px, -3px);
    }

    .arl-explore:active {
      transform: translateY(0) scale(0.96);
    }

    .arl-mask {
      position: absolute;
      inset-block: 0;
      z-index: 30;
      width: 10vw;
      pointer-events: none;
    }

    .arl-mask--left {
      left: 0;
      background: linear-gradient(90deg, var(--arl-abyss) 0%, color-mix(in srgb, var(--arl-abyss) 0%, transparent) 100%);
    }

    .arl-mask--right {
      right: 0;
      background: linear-gradient(270deg, var(--arl-abyss) 0%, color-mix(in srgb, var(--arl-abyss) 0%, transparent) 100%);
    }

    .arl-scanlines {
      position: absolute;
      inset: 0;
      z-index: 35;
      pointer-events: none;
      opacity: var(--arl-scan-opacity);
      background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--arl-snow) 6%, transparent) 0 1px, transparent 1px 3px);
      mix-blend-mode: screen;
    }

    .arl-cursor {
      position: fixed;
      z-index: 80;
      top: -52px;
      left: -52px;
      display: grid;
      width: 104px;
      height: 104px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--arl-snow) 45%, transparent);
      border-radius: 50%;
      color: var(--arl-snow);
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--arl-dur-fast) ease, transform 90ms linear;
    }

    .arl-cursor[data-visible="true"] {
      opacity: 1;
    }

    .arl-reel:has(.arl-details[data-open="true"]) .arl-cursor,
    body[data-arl-modal="open"] .arl-cursor {
      opacity: 0 !important;
      display: none !important;
    }

    .arl-reel:has(.arl-details[data-open="true"]),
    body[data-arl-modal="open"] .arl-reel {
      cursor: default;
    }

    .arl-cursor[data-pressed="true"] {
      transform: translate3d(var(--cursor-x, -100px), var(--cursor-y, -100px), 0) scale(1.12);
    }

    .arl-cursor__label {
      font: 500 9px/1 var(--font-arl-mono);
      transition: opacity var(--arl-dur-fast) var(--arl-ease-out);
    }

    .arl-cursor[data-zone="left"] .arl-cursor__label,
    .arl-cursor[data-zone="right"] .arl-cursor__label {
      opacity: 0;
    }

    .arl-cursor__chevron {
      position: absolute;
      top: 50%;
      color: var(--arl-ice);
      font: 400 26px/1 var(--font-arl-display);
      opacity: 0;
      color: transparent;
      transform: translateY(-50%);
      transition: opacity var(--arl-dur-fast) var(--arl-ease-out), transform var(--arl-dur-fast) var(--arl-ease-out);
    }

    .arl-cursor__chevron--left { left: 12px; }
    .arl-cursor__chevron--right { right: 12px; }
    .arl-cursor[data-zone="left"] .arl-cursor__chevron--left,
    .arl-cursor[data-zone="right"] .arl-cursor__chevron--right { opacity: 1; color: var(--arl-ice); }

    .arl-indicator {
      position: absolute;
      left: 50%;
      bottom: 2.5dvh;
      z-index: 45;
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--arl-ink-muted);
      font: italic 400 12px/1 var(--font-arl-display);
      pointer-events: none;
      transform: translateX(-50%);
      transition: opacity var(--arl-dur-base) var(--arl-ease-out);
    }

    .arl-indicator[data-hidden="true"] {
      opacity: 0;
      pointer-events: none;
    }

    .arl-indicator__pips {
      display: flex;
      align-items: center;
      gap: 0;
      pointer-events: auto;
    }

    .arl-indicator button {
      display: grid;
      width: 18px;
      height: 20px;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .arl-indicator i {
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--arl-ink-faint);
      transform: scale(0.66);
      transition: transform var(--arl-dur-base) var(--arl-ease-out), background-color var(--arl-dur-base) var(--arl-ease-out);
    }

    .arl-indicator i[data-active="true"] {
      transform: scale(1);
      background: var(--arl-snow);
    }

    .arl-readout {
      position: absolute;
      right: 5dvh;
      bottom: 2.7dvh;
      z-index: 44;
      display: flex;
      align-items: baseline;
      gap: 10px;
      color: var(--arl-ink-muted);
      font: 500 10px/1 var(--font-arl-mono);
    }

    .arl-readout span,
    .arl-readout small {
      color: var(--arl-ice);
    }

    .arl-readout b {
      color: var(--arl-snow);
      font-weight: 500;
    }

    .arl-readout small {
      font-size: 9px;
    }

    .arl-backdrop {
      position: absolute;
      inset: var(--arl-pad-y) 10vw var(--arl-pad-y) 10vw;
      z-index: 60;
      width: 80vw;
      padding: 0;
      border: 0;
      border-radius: clamp(24px, 3.3vw, 48px);
      background: color-mix(in srgb, var(--arl-abyss) 48%, transparent);
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(0);
      cursor: pointer;
      transition: opacity 600ms var(--arl-ease-door), backdrop-filter 600ms var(--arl-ease-door);
    }

    .arl-backdrop[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
      backdrop-filter: blur(14px);
    }

    .arl-details {
      position: absolute;
      inset: var(--arl-pad-y) var(--arl-pad-y) var(--arl-pad-y) auto;
      z-index: 70;
      width: min(640px, 52%);
      overflow: clip;
      border: 0;
      border-radius: clamp(24px, 3.3vw, 48px);
      background: linear-gradient(180deg, color-mix(in srgb, var(--arl-navy) 90%, transparent) 0%, color-mix(in srgb, var(--arl-abyss) 96%, transparent) 100%);
      box-shadow: -30px 0 80px color-mix(in srgb, var(--arl-abyss) 80%, transparent);
      transform: translate3d(calc(100% + 10vw), 0, 0);
      transition: transform var(--arl-dur-door) var(--arl-ease-door);
      pointer-events: none;
      cursor: default;
      user-select: text;
    }

    .arl-details[data-open="true"] {
      transform: translate3d(0, 0, 0);
      pointer-events: auto;
    }

    .arl-details__scroll {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      touch-action: pan-y;
      cursor: default;
    }

    .arl-details__scroll:focus {
      outline: none;
    }

    .arl-details__scroll:focus-visible {
      outline: 1px solid var(--arl-line);
      outline-offset: -1px;
    }

    .arl-details,
    .arl-details *,
    .arl-details__scroll,
    .arl-details__scroll * {
      cursor: default;
    }

    .arl-details button,
    .arl-details button *,
    .arl-details a,
    .arl-details a *,
    .arl-details__close,
    .arl-details__close * {
      cursor: pointer;
    }

    .arl-details__image {
      position: relative;
      height: 35dvh;
      flex: none;
    }

    .arl-details__image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(1.12) brightness(0.9);
    }

    .arl-details__image div {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 20%, var(--arl-abyss) 100%);
    }

    .arl-details__body {
      padding: 1dvh 3.5dvh 4dvh;
    }

    .arl-details__eyebrow {
      margin: 0;
      color: var(--arl-ink-muted);
      font: 500 10px/1.35 var(--font-arl-mono);
    }

    .arl-details h2 {
      display: grid;
      margin: 12px 0 0;
      color: var(--arl-snow);
      font: 600 clamp(2.5rem, 5.8dvh, 4rem)/0.88 var(--font-arl-display);
      letter-spacing: -0.045em;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .arl-details__meta {
      margin: 16px 0 0;
      color: var(--arl-ink-soft);
      font: 500 10px/1.4 var(--font-arl-mono);
    }

    .arl-details hr {
      height: 1px;
      margin: 24px 0;
      border: 0;
      background: var(--arl-line);
    }

    .arl-details__description {
      margin: 0;
      color: var(--arl-ink-soft);
      font: italic 400 16px/1.65 var(--font-arl-display);
    }

    .arl-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px 18px;
    }

    .arl-stat {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .arl-stat span {
      color: var(--arl-ink-muted);
      font: 500 9px/1.2 var(--font-arl-mono);
    }

    .arl-stat strong {
      color: var(--arl-snow);
      font: 500 18px/1 var(--font-arl-display);
      overflow-wrap: anywhere;
    }

    .arl-stat--country {

    function wrapIndex(index, total) {
      if (total <= 0) return 0;
      return ((index % total) + total) % total;
    }

    function targetX(leftPadPx, pitchPx, index) {
      return leftPadPx - index * pitchPx;
    }

    function springStep(current, target, factor = 0.11) {
      return current + (target - current) * factor;
    }

    function parallaxOffset(deltaX, ratio = 1.2) {
      if (ratio <= 0) return 0;
      return -deltaX / ratio;
    }

    function smoothstep(value) {
      const t = Math.max(0, Math.min(1, value));
      return t * t * (3 - 2 * t);
    }

      if (slideWidthPx <= 0) return 0;
      return smoothstep(1 - Math.abs(deltaX) / (slideWidthPx * 0.55));

      return wrapIndex(current + (deltaX < 0 ? 1 : -1), total);
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));

    let targetXVal = 0;
    let intro = true;
    let openPeak = null;
    let dragging = false;
    let dragStart = 0;
    let dragOrigin = 0;
    let hoverZone = "center";
    let normalizeTimer = null;
    let introId = null;
    let rafId = null;
    let lastFrame = { x: NaN, index: -1, intro: true };

    function measure() {
      const width = window.innerWidth;
      const mobile = width <= 800;
      const leftPad = width * (mobile ? 0.07 : 0.1);
      const pitch = width * ((mobile ? 90 : PITCH_VW) / 100);
      return { leftPad, pitch };
    }

    function syncTarget() {
      const { leftPad, pitch } = measure();
      targetXVal = targetX(leftPad, pitch, slot);
    }

    function writeTrack(val) {
      currentX = val;
      track.style.transform = `translate3d(${val}px, 0, 0)`;
    }

    function updateContent() {
      const { leftPad, pitch } = measure();
      const slideWidth = window.innerWidth * (SLIDE_WIDTH_VW / 100);
      const activeSlot = slot;
      const activeDelta = currentX - targetX(leftPad, pitch, activeSlot);
      const progress = contentProgress(activeDelta, slideWidth);
      const activeNodes = track.querySelectorAll(`[data-index="${activeIndex}"]`);
      activeNodes.forEach(node => {
        const content = node.querySelector(".arl-slide__content");
        const image = node.querySelector(".arl-slide__image");
        if (content) {
          content.style.setProperty("--arl-content-opacity", intro ? "0" : progress);
          content.style.setProperty("--arl-content-x", `${(1 - progress) * 56}px`);
          content.style.setProperty("--arl-content-blur", `${(1 - progress) * 12}px`);
        }
        if (image) {
          image.style.setProperty("--arl-parallax", `${parallaxOffset(activeDelta)}px`);
        }
      });
    }

    function tick() {
      const delta = targetXVal - currentX;
      if (!intro && !dragging && Math.abs(delta) > 0.1) {
        writeTrack(springStep(currentX, targetXVal));
      }
      if (lastFrame.x !== currentX || lastFrame.index !== activeIndex || lastFrame.intro !== intro) {
        lastFrame.x = currentX;
        lastFrame.index = activeIndex;
        lastFrame.intro = intro;
        updateContent();
      }
      rafId = requestAnimationFrame(tick);
    }

    function normalizeSlot() {
      if (slot >= COPY_OFFSET + PEAKS.length) slot -= PEAKS.length;
      if (slot < COPY_OFFSET) slot += PEAKS.length;
      syncTarget();
      writeTrack(targetXVal);
    }

    function setActiveIndex(next) {
      activeIndex = next;
      track.querySelectorAll(".arl-slide").forEach(s => {
        s.dataset.active = (Number(s.dataset.index) === next) ? "true" : "false";
      });
      indicatorCurrent.textContent = String(next + 1).padStart(2, "0");
      const pips = pipsContainer.querySelectorAll("button");
      pips.forEach((btn, i) => {
        btn.setAttribute("aria-pressed", i === next ? "true" : "false");
        const icon = btn.querySelector("i");
        if (icon) icon.dataset.active = i === next ? "true" : "false";
      });
      readoutIndex.textContent = String(next + 1).padStart(2, "0");
      readoutName.textContent = PEAKS[next].name;
      readoutElevation.textContent = PEAKS[next].stats.elevation;
    }

    function selectIndex(index) {
      const next = wrapIndex(index, PEAKS.length);
      cancelIntro();
      slot = COPY_OFFSET + next;
      setActiveIndex(next);
      syncTarget();
      if (Math.abs(targetXVal - currentX) > window.innerWidth * 1.4) {
        writeTrack(targetXVal);
      }
    }

    function cancelIntro() {
      if (introId) {
        cancelAnimationFrame(introId);
        introId = null;
      }
      if (intro) {
        intro = false;
        root.dataset.intro = "false";
        if (motionBlur) motionBlur.setAttribute("stdDeviation", "0 0");
        if (scanlines) scanlines.style.setProperty("--arl-scan-opacity", "0");
      }
    }

    function navigate(direction) {
      cancelIntro();
      const wanted = slot + direction;
      const wrapBy = wanted < COPY_OFFSET - EDGE_SLIDES
        ? PEAKS.length
        : (wanted >= COPY_OFFSET + PEAKS.length + EDGE_SLIDES ? -PEAKS.length : 0);
      if (wrapBy) {
        writeTrack(currentX - wrapBy * measure().pitch);
        slot += wrapBy;
      }
      const nextSlot = slot + direction;
      const nextIndex = wrapIndex(nextSlot, PEAKS.length);
      slot = nextSlot;
      setActiveIndex(nextIndex);
      syncTarget();
      if (normalizeTimer) clearTimeout(normalizeTimer);
      normalizeTimer = setTimeout(normalizeSlot, 760);
    }

    function openDetails(peak) {
      openPeak = peak;
      document.body.dataset.arlModal = "open";
      root.style.cursor = "default";

      detailsScroll.innerHTML = `
        <div class="arl-details__image">
          <img src="${imageUrl(peak)}" alt="">
          <div></div>
        </div>
        <div class="arl-details__body">
          <p class="arl-details__eyebrow">${peak.eyebrow}</p>
          <h2><span>${peak.titleLines[0]}</span><span>${peak.titleLines[1]}</span></h2>
          <p class="arl-details__meta">${peak.firstAscent} · ${peak.year} · ${peak.range}</p>
          <hr>
          <p class="arl-details__description">${peak.description}</p>
          <hr>
          <div class="arl-stats-grid">
            <div class="arl-stat"><span>Success</span><strong>${peak.stats.success}%</strong></div>
            <div class="arl-stat"><span>Survival</span><strong>${peak.stats.survival}%</strong></div>
            <div class="arl-stat"><span>Elevation</span><strong>${peak.stats.elevation}</strong></div>
            <div class="arl-stat"><span>Prominence</span><strong>${peak.stats.prominence}</strong></div>
            <div class="arl-stat"><span>Coordinates</span><strong>${peak.stats.coordinates}</strong></div>
            <div class="arl-stat"><span>Season</span><strong>${peak.stats.season}</strong></div>
          </div>
          <div class="arl-stat arl-stat--country"><span>Country</span><strong>${peak.stats.country}</strong></div>
          <hr>
          <div class="arl-awards-list">
            ${peak.awards.map(item => `
              <div class="arl-award">
                <span class="arl-stars" aria-label="${item.stars} out of 5 stars">
                  ${[0,1,2,3,4].map(idx => `<span aria-hidden="true" data-filled="${idx < item.stars}">✦</span>`).join("")}
                </span>
                <span class="arl-award__label">${item.label}</span>
                <span class="arl-award__quote">“${item.quote}”</span>
              </div>
            `).join("")}
          </div>
        </div>
      `;

      backdropEl.dataset.open = "true";
      detailsEl.dataset.open = "true";
      detailsEl.setAttribute("aria-hidden", "false");
      indicatorEl.dataset.hidden = "true";
      indicatorEl.setAttribute("aria-hidden", "true");
      cursorEl.style.display = "none";

      track.querySelectorAll(".arl-slide").forEach(s => {
        s.dataset.open = (s.dataset.copy === "2" && Number(s.dataset.index) === PEAKS.indexOf(peak)) ? "true" : "false";
      });
    }

    function closeDetails() {
      openPeak = null;
      delete document.body.dataset.arlModal;
      root.style.cursor = "";
      backdropEl.dataset.open = "false";
      detailsEl.dataset.open = "false";
      detailsEl.setAttribute("aria-hidden", "true");
      indicatorEl.dataset.hidden = "false";
      indicatorEl.setAttribute("aria-hidden", "false");
      cursorEl.style.display = "";

      track.querySelectorAll(".arl-slide").forEach(s => {
        s.dataset.open = "false";
      });
    }

    // Build Indicator Pips
    PEAKS.forEach((peak, index) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("aria-label", `Go to ${peak.name}`);
      btn.setAttribute("aria-pressed", index === activeIndex ? "true" : "false");
      const icon = document.createElement("i");
      icon.dataset.active = index === activeIndex ? "true" : "false";
      btn.appendChild(icon);
      btn.addEventListener("click", () => selectIndex(index));
      pipsContainer.appendChild(btn);
    });

    // Build Reel Track Slides
    for (let copy = 0; copy < LOOP_COPIES; copy++) {
      for (let index = 0; index < PEAKS.length; index++) {
        const peak = PEAKS[index];
        const active = (index === activeIndex);
        const full = renderedInFull(copy, index);

        const slide = document.createElement("article");
        slide.className = "arl-slide";
        slide.dataset.index = index;
        slide.dataset.copy = copy;
        slide.dataset.active = active ? "true" : "false";
        slide.dataset.open = "false";
        if (copy !== 2) {
          slide.setAttribute("aria-hidden", "true");
          slide.setAttribute("inert", "");
        }
        slide.setAttribute("aria-label", `${peak.name}, ${peak.stats.elevation}`);

        const inner = document.createElement("div");
        inner.className = "arl-slide__inner";

        if (full) {
          const imgWrapper = document.createElement("div");
          imgWrapper.className = "arl-slide__image";
          imgWrapper.setAttribute("aria-hidden", "true");

          const img = document.createElement("img");
          const highSrc = imageUrl(peak);
          const lowSrc = `https://images.unsplash.com/photo-${peak.imageId}?auto=format&fit=crop&w=800&q=80`;
          img.src = highSrc;
          img.srcset = `${lowSrc} 800w, ${highSrc} 1600w`;
          img.sizes = "(max-width: 800px) 90vw, 80vw";
          img.alt = "";
          img.draggable = false;
          img.loading = (copy === 2 && index <= 1) ? "eager" : "lazy";
          if (copy === 2 && index <= 1) {
            img.fetchPriority = index === 1 ? "high" : "auto";
          } else {
            img.fetchPriority = "low";
          }

          const tint = document.createElement("div");
          tint.className = "arl-slide__tint";
          const vignette = document.createElement("div");
          vignette.className = "arl-slide__vignette";

          imgWrapper.appendChild(img);
          imgWrapper.appendChild(tint);
          imgWrapper.appendChild(vignette);
          inner.appendChild(imgWrapper);

          const [eyebrowA, eyebrowB] = splitEyebrow(peak.eyebrow);
          const content = document.createElement("div");
          content.className = "arl-slide__content";
          content.innerHTML = `
            <div class="arl-slide__topline">
              <div class="arl-year">${peak.year}</div>
              <div class="arl-eyebrow"><span>${eyebrowA}</span><span>${eyebrowB}</span></div>
              <div class="arl-badge"><span>8,000</span><small>metres</small></div>
            </div>
            <div class="arl-slide__title-block">
              <p class="arl-range">${peak.range} · ${peak.rank}</p>
              <h2>
                <span>${peak.titleLines[0]}</span>
                <span>${peak.titleLines[1]}</span>
              </h2>
              <div class="arl-ascent-row">
                <span><b>First ascent</b>${peak.firstAscent}</span>
                <span><b>Elevation</b>${peak.stats.elevation}</span>
              </div>
            </div>
            <div class="arl-slide__awards" aria-label="${peak.name} accolades">
              ${peak.awards.map(item => `
                <div class="arl-award">
                  <span class="arl-stars" aria-label="${item.stars} out of 5 stars">
                    ${[0,1,2,3,4].map(idx => `<span aria-hidden="true" data-filled="${idx < item.stars}">✦</span>`).join("")}
                  </span>
                  <span class="arl-award__label">${item.label}</span>
                  <span class="arl-award__quote">“${item.quote}”</span>
                </div>
              `).join("")}
            </div>
            <button type="button" class="arl-explore">
              <span>Explore</span><span aria-hidden="true">↗</span>
            </button>
          `;

          const exploreBtn = content.querySelector(".arl-explore");
          exploreBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            openDetails(peak);
          });

          inner.appendChild(content);
        }

        slide.appendChild(inner);
        track.appendChild(slide);
      }
    }

    // Modal close event handlers
    backdropEl.addEventListener("click", closeDetails);
    detailsClose.addEventListener("click", closeDetails);

    // Initial positioning & intro
    const { leftPad, pitch } = measure();
    const startX = targetX(leftPad, pitch, INITIAL_SLOT);
    const sweepEndX = targetX(leftPad, pitch, SWEEP_END_SLOT);

    if (reducedMotion) {
      writeTrack(targetX(leftPad, pitch, COPY_OFFSET));
      slot = COPY_OFFSET;
      syncTarget();
      intro = false;
      root.dataset.intro = "false";
      root.dataset.reduced = "true";
      setActiveIndex(0);
    } else {
      root.dataset.intro = "true";
      writeTrack(startX);
      slot = INITIAL_SLOT;
      syncTarget();
      activeIndex = AUTO_START_INDEX;
      setActiveIndex(AUTO_START_INDEX);

      const startedAt = performance.now();
      const introTick = (now) => {
        const t = clamp((now - startedAt) / 3000, 0, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        const speed = Math.pow(1 - t, 2);
        writeTrack(startX + (sweepEndX - startX) * eased);
        if (motionBlur) motionBlur.setAttribute("stdDeviation", `${(speed * 18).toFixed(2)} 0`);
        if (scanlines) scanlines.style.setProperty("--arl-scan-opacity", speed.toFixed(3));

        if (t < 1) {
          introId = requestAnimationFrame(introTick);
        } else {
          slot = COPY_OFFSET;
          setActiveIndex(0);
          intro = false;
          root.dataset.intro = "false";
          if (motionBlur) motionBlur.setAttribute("stdDeviation", "0 0");
          if (scanlines) scanlines.style.setProperty("--arl-scan-opacity", "0");
          syncTarget();
          writeTrack(targetXVal);
        }
      };
      introId = requestAnimationFrame(introTick);
    }

    // RAF loop
    rafId = requestAnimationFrame(tick);

    // Resize handler
    window.addEventListener("resize", () => {
      syncTarget();
      if (!dragging) writeTrack(targetXVal);
    });

    // Keyboard navigation
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeDetails();
        return;
      }
      if (openPeak) return;
      const target = event.target;
      if (target && ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName)) return;
      if (event.key === "ArrowRight" || event.key === "ArrowDown") {
        event.preventDefault();
        navigate(1);
      }
      if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
        event.preventDefault();
        navigate(-1);
      }
    });

    // Wheel navigation
    root.addEventListener("wheel", (event) => {
      if (event.target.closest(".arl-details")) return;
      if (openPeak) {
        event.preventDefault();
        return;
      }
      event.preventDefault();
      if (Math.abs(event.deltaX) < 1 && Math.abs(event.deltaY) < 1) return;
      const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
      navigate(delta > 0 ? 1 : -1);
    }, { passive: false });

    // Pointer events
    root.addEventListener("pointerdown", (event) => {
      if (openPeak || event.target.closest(".arl-details")) return;
      if (event.target.closest("button")) return;
      dragging = true;
      dragStart = event.clientX;
      dragOrigin = currentX;
      if (root.setPointerCapture) root.setPointerCapture(event.pointerId);
      cursorEl.dataset.pressed = "true";
      cursorEl.style.setProperty("--cursor-x", `${event.clientX}px`);
      cursorEl.style.setProperty("--cursor-y", `${event.clientY}px`);
      cursorEl.style.transform = `translate3d(${event.clientX}px, ${event.clientY}px, 0) scale(1.12)`;
    });

    root.addEventListener("pointermove", (event) => {
      const isInsideDetails = Boolean(event.target.closest(".arl-details"));
      const zone = (openPeak || isInsideDetails)
        ? "center"
        : (event.clientX < window.innerWidth * 0.1 ? "left" : event.clientX > window.innerWidth * 0.9 ? "right" : "center");
      hoverZone = zone;
      cursorEl.dataset.visible = "true";
      cursorEl.dataset.zone = zone;
      cursorEl.style.setProperty("--cursor-x", `${event.clientX}px`);
      cursorEl.style.setProperty("--cursor-y", `${event.clientY}px`);
      cursorEl.style.transform = `translate3d(${event.clientX}px, ${event.clientY}px, 0)${dragging ? ' scale(1.12)' : ''}`;
      const label = cursorEl.querySelector(".arl-cursor__label");
      if (label) label.textContent = zone === "center" ? "Scroll" : "";

      if (dragging) {
        writeTrack(dragOrigin + (event.clientX - dragStart));
      }
    });

    const onPointerUp = (event) => {
      if (openPeak || event.target.closest(".arl-details")) {
        dragging = false;
        try { root.releasePointerCapture(event.pointerId); } catch (e) {}
        cursorEl.dataset.pressed = "false";
        cursorEl.style.transform = `translate3d(${event.clientX}px, ${event.clientY}px, 0)`;
        return;
      }
      if (!dragging) {
        if (hoverZone === "left") navigate(-1);
        if (hoverZone === "right") navigate(1);
        cursorEl.dataset.pressed = "false";
        cursorEl.style.transform = `translate3d(${event.clientX}px, ${event.clientY}px, 0)`;
        return;
      }
      dragging = false;
      try { root.releasePointerCapture(event.pointerId); } catch (e) {}
      const delta = event.clientX - dragStart;
      const next = indexForDrag(delta, window.innerWidth, activeIndex, PEAKS.length, DRAG_THRESHOLD);
      if (next !== activeIndex) {
        navigate(delta < 0 ? 1 : -1);
      } else {
        syncTarget();
      }
      cursorEl.dataset.pressed = "false";
      cursorEl.style.transform = `translate3d(${event.clientX}px, ${event.clientY}px, 0)`;
    };

    root.addEventListener("pointerup", onPointerUp);
    root.addEventListener("pointercancel", onPointerUp);
    root.addEventListener("pointerenter", (event) => {
      cursorEl.dataset.visible = "true";
      cursorEl.style.setProperty("--cursor-x", `${event.clientX}px`);
      cursorEl.style.setProperty("--cursor-y", `${event.clientY}px`);
      cursorEl.style.transform = `translate3d(${event.clientX}px, ${event.clientY}px, 0)`;
    });
    root.addEventListener("pointerleave", () => {
      cursorEl.dataset.visible = "false";
      cursorEl.dataset.pressed = "false";
    });

    // Warm sweep image loading once page is ready
    const warmSweepPath = () => root.querySelectorAll('img[loading="lazy"]').forEach(img => { img.loading = "eager"; });
    if (document.readyState === "complete") warmSweepPath();
    else window.addEventListener("load", warmSweepPath, { once: true });
  </script>
</body>
</html>
